# Which modules' flow each recipe of odoo/common/odoo-functional/recipes describes.
#
# A module is listed under a recipe only when the recipe walks through what a user does
# with it (setup, the standard flow or a variation), not when it is merely named. Every
# recipe has an entry, even an empty one, so a new recipe cannot be forgotten. A module
# listed here counts as covered in every version that ships it.

