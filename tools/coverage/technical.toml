# Modules with no user-facing flow of their own: nothing to configure, no menu, no setting.
#
# Each needs a one-line reason. A module with menus, settings or views a user works with
# does not belong here, even when it is installed automatically: it is missing until a
# recipe describes it. A module listed here counts as technical in every version that
# ships it.

[technical]
# Framework and web client plumbing
attachment_indexation = "Indexes attachment content for search; nothing to configure"
base_sparse_field = "Storage for sparse fields, used by other modules' code"
bus = "Real-time notification bus used by the web client"
http_routing = "URL routing and slugs for the website and portal"
html_editor = "The HTML editor component other modules build on"
